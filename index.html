<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="掃碼比價">
  <title>掃碼比價</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #111; color: #fff;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
    }
    header {
      width: 100%; padding: 16px 20px;
      text-align: center; font-size: 17px; font-weight: 600;
      border-bottom: 1px solid #222;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .header-btn {
      position: absolute; right: 16px;
      background: none; border: none; color: #888;
      font-size: 13px; cursor: pointer; padding: 4px 8px;
    }
    #scanner-section { width: 100%; max-width: 480px; }
    #reader { width: 100%; }
    #reader video { width: 100% !important; }
    #hint { text-align: center; color: #888; font-size: 14px; padding: 12px 20px; }

    #result-section {
      display: none; width: 100%; max-width: 480px;
      padding: 24px 20px; flex-direction: column; align-items: center; gap: 12px;
    }
    #result-section.show { display: flex; }

    .barcode-num { color: #555; font-size: 13px; letter-spacing: 1px; }
    .product-name { font-size: 18px; font-weight: 600; text-align: center; line-height: 1.4; }
    .not-found { color: #888; font-size: 14px; text-align: center; line-height: 1.6; }
    .divider { width: 40px; height: 1px; background: #333; margin: 4px 0; }

    .badge {
      display: inline-block; font-size: 11px; font-weight: 500;
      padding: 2px 8px; border-radius: 20px; margin-top: 4px;
    }
    .badge-cached { background: #1a3a1a; color: #4cd964; }
    .badge-off { background: #1a2a3a; color: #5ac8fa; }
    .badge-off-fail { background: #3a1a1a; color: #ff9f0a; }

    .btn {
      display: block; width: 100%; padding: 16px; border-radius: 12px;
      font-size: 16px; font-weight: 600; text-align: center;
      cursor: pointer; border: none; text-decoration: none;
    }
    .btn-primary { background: #ff3b30; color: #fff; }
    .btn-secondary { background: #1c1c1e; color: #fff; border: 1px solid #333; }
    .btn-danger { background: #1c1c1e; color: #ff453a; border: 1px solid #3a1a1a; }

    #loading { display: none; color: #888; font-size: 14px; padding: 8px; }
    #off-status { font-size: 12px; color: #555; min-height: 16px; }

    input.text-field {
      display: none; width: 100%; padding: 14px; border-radius: 12px;
      border: 1px solid #333; background: #1c1c1e; color: #fff; font-size: 15px;
    }

    /* 設定畫面 */
    #settings-section {
      display: none; width: 100%; max-width: 480px;
      padding: 24px 20px; flex-direction: column; gap: 12px;
    }
    #settings-section.show { display: flex; }
    .settings-label { font-size: 13px; color: #888; margin-bottom: 4px; }
    .settings-note { font-size: 12px; color: #555; text-align: center; line-height: 1.6; }

    /* 歷史紀錄畫面 */
    #history-section {
      display: none; width: 100%; max-width: 480px;
      padding: 16px 20px; flex-direction: column; gap: 8px;
    }
    #history-section.show { display: flex; }
    .history-item {
      background: #1c1c1e; border-radius: 12px; padding: 14px 16px;
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }
    .history-item-info { flex: 1; min-width: 0; }
    .history-item-name { font-size: 15px; font-weight: 600; }
    .history-item-barcode { font-size: 12px; color: #555; margin-top: 2px; }
    .history-item-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .icon-btn { background: none; border: none; color: #888; font-size: 20px; cursor: pointer; padding: 10px; }
    .history-empty { color: #555; font-size: 14px; text-align: center; padding: 40px 0; }
  </style>
</head>
<body>

  <header>
    掃碼比價
    <button class="header-btn" id="settings-btn" onclick="toggleSettings()">設定</button>
  </header>
  <p id="build-ver" style="font-size:10px;color:#666;padding:4px;"></p>

  <!-- 掃描 -->
  <div id="scanner-section">
    <div id="reader"></div>
    <p id="hint">將相機對準條碼，保持穩定</p>
  </div>

  <!-- 結果 -->
  <div id="result-section">
    <p class="barcode-num" id="barcode-display"></p>
    <div class="divider"></div>
    <div style="text-align:center">
      <p class="product-name" id="product-display"></p>
      <span id="status-badge" class="badge" style="display:none"></span>
    </div>
    <p id="loading">查詢商品中...</p>
    <input id="query-input" class="text-field" type="text" placeholder="輸入中文商品名稱">
    <p id="off-status"></p>
    <button class="btn btn-primary" id="biggo-btn" onclick="openBiggo()" style="display:none;">在 BigGo 比價 →</button>
    <button class="btn btn-danger" id="forget-btn" onclick="forgetBarcode()" style="display:none;">刪除此商品記憶</button>
    <button class="btn btn-secondary" onclick="restart()">重新掃描</button>
  </div>

  <!-- 設定 -->
  <div id="settings-section">
    <p class="settings-label">Open Food Facts 帳號（用於貢獻中文商品名）</p>
    <input id="off-user" class="text-field" type="text" placeholder="Username" style="display:block">
    <input id="off-pass" class="text-field" type="password" placeholder="Password" style="display:block">
    <button class="btn btn-primary" onclick="saveSettings()">儲存</button>
    <p class="settings-note">
      帳號密碼儲存在你的手機瀏覽器，不會上傳到任何伺服器。<br>
      沒有帳號也可以用，只是不會自動貢獻資料給 Open Food Facts。
    </p>
    <div class="divider" style="width:100%; margin: 8px 0;"></div>
    <button class="btn btn-secondary" onclick="toggleHistory()">查看商品紀錄</button>
    <button class="btn btn-secondary" onclick="exportData()">匯出條碼資料</button>
    <textarea id="export-area" style="display:none;width:100%;height:120px;padding:12px;border-radius:12px;border:1px solid #333;background:#1c1c1e;color:#aaa;font-size:12px;font-family:monospace;resize:none;" readonly></textarea>
    <p id="export-hint" style="display:none;font-size:12px;color:#555;text-align:center;">全選複製後貼到 Claude 對話，請他幫你上傳到 Open Food Facts</p>
  </div>

  <!-- 歷史紀錄 -->
  <div id="history-section">
    <input id="history-search" class="text-field" type="search" placeholder="搜尋商品名稱..." oninput="renderHistory()" style="display:block;">
    <div id="history-list"></div>
    <button class="btn btn-secondary" onclick="toggleHistory()">關閉</button>
  </div>

  <script>
    const DB_KEY = 'barcode_names';
    const OFF_USER_KEY = 'off_user';
    const OFF_PASS_KEY = 'off_pass';
    let currentBarcode = '';
    let scanner = null;

    // localStorage helpers
    function getDB() {
      try { return JSON.parse(localStorage.getItem(DB_KEY) || '{}'); } catch { return {}; }
    }
    function saveDB(db) { localStorage.setItem(DB_KEY, JSON.stringify(db)); }
    function getCachedName(b) { return getDB()[b] || null; }
    function cacheName(b, name) {
      if (!name.trim()) return;
      const db = getDB(); db[b] = name.trim(); saveDB(db);
    }
    function getOFFCreds() {
      return {
        user: localStorage.getItem(OFF_USER_KEY) || '',
        pass: localStorage.getItem(OFF_PASS_KEY) || ''
      };
    }

    // 設定
    function toggleSettings() {
      const s = document.getElementById('settings-section');
      const showing = s.classList.contains('show');
      hideAll();
      if (!showing) {
        const { user, pass } = getOFFCreds();
        document.getElementById('off-user').value = user;
        document.getElementById('off-pass').value = pass;
        s.classList.add('show');
        document.getElementById('settings-btn').textContent = '關閉';
      } else {
        document.getElementById('settings-btn').textContent = '設定';
        startScanner();
      }
    }

    function saveSettings() {
      localStorage.setItem(OFF_USER_KEY, document.getElementById('off-user').value.trim());
      localStorage.setItem(OFF_PASS_KEY, document.getElementById('off-pass').value);
      hideAll();
      document.getElementById('settings-btn').textContent = '設定';
      startScanner();
    }

    // 提交到 Open Food Facts
    async function submitToOFF(barcode, name) {
      const { user, pass } = getOFFCreds();
      if (!user || !pass) return null;

      const body = new URLSearchParams({
        code: barcode,
        user_id: user,
        password: pass,
        'product_name_zh-TW': name,
        product_name_zh: name,
      });

      try {
        const res = await fetch('https://world.openfoodfacts.org/cgi/product_jqm2.pl', {
          method: 'POST', body
        });
        const text = await res.text();
        return text.includes('"status":1') || text.includes('fields saved');
      } catch { return false; }
    }

    function forgetBarcode() {
      const db = getDB(); delete db[currentBarcode]; saveDB(db);
      document.getElementById('forget-btn').style.display = 'none';
      document.getElementById('status-badge').style.display = 'none';
    }

    function stopMediaTracks() {
      document.querySelectorAll('video').forEach(v => {
        if (v.srcObject) {
          v.srcObject.getTracks().forEach(t => t.stop());
          v.srcObject = null;
        }
      });
    }

    function hideAll() {
      if (scanner) { scanner.stop().catch(() => {}); scanner = null; }
      stopMediaTracks();
      document.getElementById('reader').innerHTML = '';
      document.getElementById('scanner-section').style.display = 'none';
      document.getElementById('result-section').classList.remove('show');
      document.getElementById('settings-section').classList.remove('show');
      document.getElementById('history-section').classList.remove('show');
    }

    function startScanner() {
      hideAll();
      document.getElementById('scanner-section').style.display = 'block';
      document.getElementById('hint').textContent = '將相機對準條碼，保持穩定';
      document.getElementById('settings-btn').textContent = '設定';

      setTimeout(() => {
        scanner = new Html5Qrcode("reader");
        scanner.start(
          { facingMode: "environment" },
          {
            fps: 15,
            aspectRatio: 1.7777778,
            formatsToSupport: [
              Html5QrcodeSupportedFormats.EAN_13,
              Html5QrcodeSupportedFormats.EAN_8,
              Html5QrcodeSupportedFormats.UPC_A,
              Html5QrcodeSupportedFormats.UPC_E,
              Html5QrcodeSupportedFormats.CODE_128,
            ],
            experimentalFeatures: { useBarCodeDetectorIfSupported: true }
          },
          onScanSuccess,
          () => {}
        ).catch(() => {
          document.getElementById('hint').textContent = '無法開啟相機，請確認已授權。';
        });
      }, 300);
    }

    async function onScanSuccess(barcode) {
      await scanner.stop(); scanner = null;
      document.getElementById('reader').innerHTML = '';
      currentBarcode = barcode;

      document.getElementById('scanner-section').style.display = 'none';
      document.getElementById('barcode-display').textContent = '條碼：' + barcode;
      document.getElementById('product-display').textContent = '';
      document.getElementById('status-badge').style.display = 'none';
      document.getElementById('forget-btn').style.display = 'none';
      document.getElementById('biggo-btn').style.display = 'none';
      document.getElementById('query-input').style.display = 'none';
      document.getElementById('off-status').textContent = '';
      document.getElementById('result-section').classList.add('show');

      // 先查本機快取
      const cached = getCachedName(barcode);
      if (cached) {
        document.getElementById('product-display').textContent = cached;
        showBadge('cached-badge', '已記憶');
        document.getElementById('query-input').value = cached;
        document.getElementById('query-input').style.display = 'block';
        document.getElementById('biggo-btn').style.display = 'block';
        document.getElementById('forget-btn').style.display = 'block';
        return;
      }

      // 查 Open Food Facts
      document.getElementById('loading').style.display = 'block';
      let name = '';
      try {
        const res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${barcode}.json`);
        const data = await res.json();
        if (data.status === 1 && data.product) {
          const p = data.product;
          const candidate = p['product_name_zh-TW'] || p['product_name_zh']
            || p['product_name_zh_TW'] || p['product_name_zh_HK'] || p['product_name'] || '';
          name = /[一-鿿]/.test(candidate) ? candidate : (candidate || '');
        }
      } catch (_) {}

      document.getElementById('loading').style.display = 'none';

      const hasChinese = /[一-鿿]/.test(name);
      if (hasChinese) {
        document.getElementById('product-display').textContent = name;
      } else if (name) {
        document.getElementById('product-display').innerHTML =
          `<span class="not-found">僅找到英文名：${name}<br>請輸入中文名稱後搜尋</span>`;
      } else {
        document.getElementById('product-display').innerHTML =
          '<span class="not-found">找不到商品資料<br>請輸入中文名稱後搜尋</span>';
      }

      document.getElementById('query-input').value = hasChinese ? name : '';
      document.getElementById('query-input').style.display = 'block';
      document.getElementById('biggo-btn').style.display = 'block';
    }

    async function openBiggo() {
      const q = document.getElementById('query-input').value.trim() || currentBarcode;
      if (!q) return;

      cacheName(currentBarcode, q);

      // 背景提交到 OFF（不擋住比價動作）
      const { user } = getOFFCreds();
      if (user && /[一-鿿]/.test(q) && !getCachedName(currentBarcode)) {
        document.getElementById('off-status').textContent = '上傳到 Open Food Facts...';
        submitToOFF(currentBarcode, q).then(ok => {
          document.getElementById('off-status').textContent =
            ok ? '已貢獻到 Open Food Facts' : '上傳失敗（已存本機）';
        });
      }

      window.open(`https://biggo.com.tw/s/${encodeURIComponent(q)}`, '_blank');
    }

    function restart() {
      window.location.reload();
    }

    function showBadge(cls, text) {
      const b = document.getElementById('status-badge');
      b.className = 'badge ' + cls;
      b.textContent = text;
      b.style.display = 'inline-block';
    }

    // 歷史紀錄
    function toggleHistory() {
      const h = document.getElementById('history-section');
      const showing = h.classList.contains('show');
      if (showing) {
        h.classList.remove('show');
        toggleSettings(); // 回到設定
      } else {
        document.getElementById('settings-section').classList.remove('show');
        document.getElementById('history-search').value = '';
        renderHistory();
        h.classList.add('show');
      }
    }

    function renderHistory() {
      const db = getDB();
      const list = document.getElementById('history-list');
      const q = (document.getElementById('history-search')?.value || '').trim().toLowerCase();
      let entries = Object.entries(db);
      if (q) entries = entries.filter(([, name]) => name.toLowerCase().includes(q));
      if (entries.length === 0) {
        list.innerHTML = `<p class="history-empty">${q ? '找不到符合的商品' : '尚無記憶的商品'}</p>`;
        return;
      }
      list.innerHTML = entries.map(([barcode, name]) => `
        <div class="history-item">
          <div class="history-item-info">
            <div class="history-item-name">${name}</div>
            <div class="history-item-barcode">${barcode}</div>
          </div>
          <div class="history-item-actions">
            <button class="icon-btn" onclick="searchFromHistory('${name}')">🔍</button>
            <button class="icon-btn" onclick="deleteHistory('${barcode}')">🗑</button>
          </div>
        </div>
      `).join('');
    }

    function searchFromHistory(name) {
      window.open(`https://biggo.com.tw/s/${encodeURIComponent(name)}`, '_blank');
    }

    function deleteHistory(barcode) {
      const db = getDB(); delete db[barcode]; saveDB(db); renderHistory();
    }

    function exportData() {
      const db = getDB();
      const area = document.getElementById('export-area');
      const hint = document.getElementById('export-hint');
      if (Object.keys(db).length === 0) {
        area.value = '（尚無資料）';
      } else {
        area.value = JSON.stringify(db, null, 2);
      }
      area.style.display = 'block';
      hint.style.display = 'block';
      area.select();
    }

    fetch('https://api.github.com/repos/rogerccy/scan-price/commits/master')
      .then(r => r.json())
      .then(d => {
        const t = new Date(d.commit.author.date);
        document.getElementById('build-ver').textContent =
          'deployed: ' + t.toLocaleString('zh-TW', {timeZone:'Asia/Taipei'});
      }).catch(() => {});

    startScanner();
  </script>
</body>
</html>
