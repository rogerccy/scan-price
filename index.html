<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="掃碼比價">
  <title>掃碼比價</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #111;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      padding: 16px 20px;
      text-align: center;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    #history-btn {
      position: absolute;
      right: 16px;
      background: none;
      border: none;
      color: #888;
      font-size: 13px;
      cursor: pointer;
      padding: 4px 8px;
    }

    #scanner-section {
      width: 100%;
      max-width: 480px;
    }

    #reader { width: 100%; }
    #reader video { width: 100% !important; }

    #hint {
      text-align: center;
      color: #888;
      font-size: 14px;
      padding: 12px 20px;
    }

    #result-section {
      display: none;
      width: 100%;
      max-width: 480px;
      padding: 24px 20px;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    #result-section.show { display: flex; }

    .barcode-num {
      color: #555;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .product-name {
      font-size: 18px;
      font-weight: 600;
      text-align: center;
      line-height: 1.4;
    }

    .cached-badge {
      display: inline-block;
      background: #1a3a1a;
      color: #4cd964;
      font-size: 11px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 20px;
      margin-top: 4px;
    }

    .not-found { color: #888; font-size: 14px; text-align: center; line-height: 1.6; }

    .divider {
      width: 40px;
      height: 1px;
      background: #333;
      margin: 4px 0;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      border: none;
      text-decoration: none;
    }

    .btn-primary { background: #ff3b30; color: #fff; }
    .btn-secondary { background: #1c1c1e; color: #fff; border: 1px solid #333; }
    .btn-danger { background: #1c1c1e; color: #ff453a; border: 1px solid #3a1a1a; }

    #loading { display: none; color: #888; font-size: 14px; padding: 8px; }

    #query-input {
      display: none;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #1c1c1e;
      color: #fff;
      font-size: 15px;
    }

    /* 歷史紀錄畫面 */
    #history-section {
      display: none;
      width: 100%;
      max-width: 480px;
      padding: 16px 20px;
      flex-direction: column;
      gap: 8px;
    }

    #history-section.show { display: flex; }

    .history-item {
      background: #1c1c1e;
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .history-item-info { flex: 1; min-width: 0; }
    .history-item-name { font-size: 15px; font-weight: 600; }
    .history-item-barcode { font-size: 12px; color: #555; margin-top: 2px; }

    .history-item-actions { display: flex; gap: 8px; flex-shrink: 0; }

    .icon-btn {
      background: none;
      border: none;
      color: #888;
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
    }

    .history-empty { color: #555; font-size: 14px; text-align: center; padding: 40px 0; }
  </style>
</head>
<body>

  <header>
    掃碼比價
    <button id="history-btn" onclick="toggleHistory()">紀錄</button>
  </header>

  <div id="scanner-section">
    <div id="reader"></div>
    <p id="hint">將條碼對準框內，自動辨識</p>
  </div>

  <div id="result-section">
    <p class="barcode-num" id="barcode-display"></p>
    <div class="divider"></div>
    <div style="text-align:center">
      <p class="product-name" id="product-display"></p>
      <span id="cached-badge" class="cached-badge" style="display:none">已記憶</span>
    </div>
    <p id="loading">查詢商品中...</p>
    <input id="query-input" type="text" placeholder="輸入中文商品名稱">
    <button class="btn btn-primary" id="biggo-btn" onclick="openBiggo()" style="display:none;">在 BigGo 比價 →</button>
    <button class="btn btn-danger" id="forget-btn" onclick="forgetBarcode()" style="display:none;">刪除此商品記憶</button>
    <button class="btn btn-secondary" onclick="restart()">重新掃描</button>
  </div>

  <div id="history-section">
    <div id="history-list"></div>
  </div>

  <script>
    const DB_KEY = 'barcode_names';
    let currentBarcode = '';
    let scanner = null;

    function getDB() {
      try { return JSON.parse(localStorage.getItem(DB_KEY) || '{}'); } catch { return {}; }
    }

    function saveDB(db) {
      localStorage.setItem(DB_KEY, JSON.stringify(db));
    }

    function getCachedName(barcode) {
      return getDB()[barcode] || null;
    }

    function cacheName(barcode, name) {
      if (!name.trim()) return;
      const db = getDB();
      db[barcode] = name.trim();
      saveDB(db);
    }

    function forgetBarcode() {
      const db = getDB();
      delete db[currentBarcode];
      saveDB(db);
      document.getElementById('forget-btn').style.display = 'none';
      document.getElementById('cached-badge').style.display = 'none';
    }

    function startScanner() {
      document.getElementById('scanner-section').style.display = 'block';
      document.getElementById('result-section').classList.remove('show');
      document.getElementById('history-section').classList.remove('show');
      document.getElementById('history-btn').textContent = '紀錄';

      scanner = new Html5Qrcode("reader");
      scanner.start(
        { facingMode: "environment" },
        {
          fps: 10,
          qrbox: { width: 260, height: 120 },
          formatsToSupport: [
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8,
            Html5QrcodeSupportedFormats.UPC_A,
            Html5QrcodeSupportedFormats.UPC_E,
            Html5QrcodeSupportedFormats.CODE_128,
          ]
        },
        onScanSuccess,
        () => {}
      ).catch(() => {
        document.getElementById('hint').textContent = '無法開啟相機，請確認已授權。';
      });
    }

    async function onScanSuccess(barcode) {
      await scanner.stop();
      scanner = null;
      currentBarcode = barcode;

      document.getElementById('scanner-section').style.display = 'none';
      document.getElementById('barcode-display').textContent = '條碼：' + barcode;
      document.getElementById('product-display').textContent = '';
      document.getElementById('cached-badge').style.display = 'none';
      document.getElementById('forget-btn').style.display = 'none';
      document.getElementById('biggo-btn').style.display = 'none';
      document.getElementById('query-input').style.display = 'none';
      document.getElementById('result-section').classList.add('show');

      // 先查本機快取
      const cached = getCachedName(barcode);
      if (cached) {
        document.getElementById('product-display').textContent = cached;
        document.getElementById('cached-badge').style.display = 'inline-block';
        document.getElementById('query-input').value = cached;
        document.getElementById('query-input').style.display = 'block';
        document.getElementById('biggo-btn').style.display = 'block';
        document.getElementById('forget-btn').style.display = 'block';
        return;
      }

      // 查 Open Food Facts
      document.getElementById('loading').style.display = 'block';
      let name = '';
      try {
        const res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${barcode}.json`);
        const data = await res.json();
        if (data.status === 1 && data.product) {
          const p = data.product;
          const candidate = p['product_name_zh-TW']
            || p['product_name_zh']
            || p['product_name_zh_TW']
            || p['product_name_zh_HK']
            || p['product_name']
            || '';
          const hasChinese = /[一-鿿]/.test(candidate);
          name = hasChinese ? candidate : (candidate || '');
        }
      } catch (_) {}

      document.getElementById('loading').style.display = 'none';

      const hasChinese = /[一-鿿]/.test(name);
      if (hasChinese) {
        document.getElementById('product-display').textContent = name;
      } else if (name) {
        document.getElementById('product-display').innerHTML =
          `<span class="not-found">僅找到英文名：${name}<br>請輸入中文名稱後搜尋，下次自動記住</span>`;
      } else {
        document.getElementById('product-display').innerHTML =
          '<span class="not-found">找不到商品資料<br>請輸入中文名稱後搜尋，下次自動記住</span>';
      }

      const input = document.getElementById('query-input');
      input.value = hasChinese ? name : '';
      input.style.display = 'block';
      document.getElementById('biggo-btn').style.display = 'block';
    }

    function openBiggo() {
      const q = document.getElementById('query-input').value.trim()
        || currentBarcode;
      cacheName(currentBarcode, q);
      window.open(`https://biggo.com.tw/s/${encodeURIComponent(q)}`, '_blank');
    }

    function restart() {
      startScanner();
    }

    // 歷史紀錄
    function toggleHistory() {
      const sec = document.getElementById('history-section');
      const isShowing = sec.classList.contains('show');

      if (isShowing) {
        sec.classList.remove('show');
        document.getElementById('history-btn').textContent = '紀錄';
        startScanner();
      } else {
        if (scanner) scanner.stop().catch(() => {});
        scanner = null;
        document.getElementById('scanner-section').style.display = 'none';
        document.getElementById('result-section').classList.remove('show');
        renderHistory();
        sec.classList.add('show');
        document.getElementById('history-btn').textContent = '關閉';
      }
    }

    function renderHistory() {
      const db = getDB();
      const list = document.getElementById('history-list');
      const entries = Object.entries(db);

      if (entries.length === 0) {
        list.innerHTML = '<p class="history-empty">尚無記憶的商品</p>';
        return;
      }

      list.innerHTML = entries.map(([barcode, name]) => `
        <div class="history-item">
          <div class="history-item-info">
            <div class="history-item-name">${name}</div>
            <div class="history-item-barcode">${barcode}</div>
          </div>
          <div class="history-item-actions">
            <button class="icon-btn" onclick="searchFromHistory('${name}')">🔍</button>
            <button class="icon-btn" onclick="deleteHistory('${barcode}')">🗑</button>
          </div>
        </div>
      `).join('');
    }

    function searchFromHistory(name) {
      window.open(`https://biggo.com.tw/s/${encodeURIComponent(name)}`, '_blank');
    }

    function deleteHistory(barcode) {
      const db = getDB();
      delete db[barcode];
      saveDB(db);
      renderHistory();
    }

    startScanner();
  </script>
</body>
</html>
