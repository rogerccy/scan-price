<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="掃碼比價">
  <title>掃碼比價</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #111; color: #fff;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
    }
    header {
      width: 100%; padding: 16px 20px;
      text-align: center; font-size: 17px; font-weight: 600;
      border-bottom: 1px solid #222;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .header-btn {
      position: absolute; right: 16px;
      background: none; border: none; color: #888;
      font-size: 13px; cursor: pointer; padding: 4px 8px;
    }

    /* Home section */
    #home-section {
      display: none; width: 100%; max-width: 480px;
      padding: 20px 20px 0; flex-direction: column; gap: 12px;
    }
    #home-section.show { display: flex; }

    .scan-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 18px; border-radius: 14px;
      font-size: 17px; font-weight: 700;
      background: #ff3b30; color: #fff;
      border: none; cursor: pointer; text-decoration: none;
    }
    .scan-btn-icon { font-size: 22px; }

    .home-divider {
      width: 100%; height: 1px; background: #222; margin: 4px 0;
    }
    .home-section-label { font-size: 12px; color: #555; letter-spacing: 0.5px; }

    /* Scanner section */
    #scanner-section { display: none; width: 100%; max-width: 480px; }
    #reader { width: 100%; }
    #reader video { width: 100% !important; }
    #hint { text-align: center; color: #888; font-size: 14px; padding: 12px 20px; }
    #cancel-scan-wrap { padding: 8px 20px 20px; }

    /* Result section */
    #result-section {
      display: none; width: 100%; max-width: 480px;
      padding: 24px 20px; flex-direction: column; align-items: center; gap: 12px;
    }
    #result-section.show { display: flex; }

    .barcode-num { color: #555; font-size: 13px; letter-spacing: 1px; }
    .product-name { font-size: 18px; font-weight: 600; text-align: center; line-height: 1.4; }
    .not-found { color: #888; font-size: 14px; text-align: center; line-height: 1.6; }
    .divider { width: 40px; height: 1px; background: #333; margin: 4px 0; }

    .badge {
      display: inline-block; font-size: 11px; font-weight: 500;
      padding: 2px 8px; border-radius: 20px; margin-top: 4px;
    }
    .badge-cached { background: #1a3a1a; color: #4cd964; }

    .btn {
      display: block; width: 100%; padding: 16px; border-radius: 12px;
      font-size: 16px; font-weight: 600; text-align: center;
      cursor: pointer; border: none; text-decoration: none;
    }
    .btn-primary { background: #ff3b30; color: #fff; }
    .btn-secondary { background: #1c1c1e; color: #fff; border: 1px solid #333; }
    .btn-danger { background: #1c1c1e; color: #ff453a; border: 1px solid #3a1a1a; }

    #sync-status { font-size: 12px; color: #555; min-height: 16px; text-align: center; }

    input.text-field {
      display: none; width: 100%; padding: 14px; border-radius: 12px;
      border: 1px solid #333; background: #1c1c1e; color: #fff; font-size: 15px;
    }

    /* Settings section */
    #settings-section {
      display: none; width: 100%; max-width: 480px;
      padding: 24px 20px; flex-direction: column; gap: 12px;
    }
    #settings-section.show { display: flex; }
    .settings-label { font-size: 13px; color: #888; }
    .settings-note { font-size: 12px; color: #555; text-align: center; line-height: 1.6; }

    /* History list (inside home section) */
    .history-item {
      background: #1c1c1e; border-radius: 12px; padding: 14px 16px;
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }
    .history-item-info { flex: 1; min-width: 0; cursor: pointer; padding: 4px 0; }
    .history-item-name { font-size: 15px; font-weight: 600; }
    .history-item-barcode { font-size: 12px; color: #555; margin-top: 2px; }
    .history-item-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .icon-btn { background: none; border: none; color: #888; font-size: 20px; cursor: pointer; padding: 10px; }
    .history-empty { color: #555; font-size: 14px; text-align: center; padding: 40px 0; }

    #history-list { display: flex; flex-direction: column; gap: 8px; }
  </style>
</head>
<body>

  <header>
    <button class="header-btn" id="home-btn" style="left:16px;right:auto;display:none;" onclick="showHome()">首頁</button>
    掃碼比價
    <button class="header-btn" id="settings-btn" onclick="toggleSettings()">設定</button>
  </header>
  <p id="build-ver" style="font-size:10px;color:#666;padding:4px;"></p>

  <!-- Home: scan button + history list -->
  <div id="home-section">
    <button class="scan-btn" onclick="startScanner()">
      <span class="scan-btn-icon">📷</span> 掃描條碼
    </button>
    <div class="home-divider"></div>
    <p class="home-section-label">商品記憶</p>
    <input id="history-search" class="text-field" type="search" placeholder="搜尋商品名稱..." oninput="renderHistory()" style="display:block;">
    <div id="history-list"></div>
  </div>

  <!-- Scanner -->
  <div id="scanner-section">
    <div id="reader"></div>
    <p id="hint">將相機對準條碼，保持穩定</p>
    <div id="cancel-scan-wrap">
      <button class="btn btn-secondary" onclick="showHome()">取消</button>
    </div>
  </div>

  <!-- Result -->
  <div id="result-section">
    <p class="barcode-num" id="barcode-display"></p>
    <div class="divider"></div>
    <div style="text-align:center">
      <p class="product-name" id="product-display"></p>
      <span id="status-badge" class="badge" style="display:none"></span>
    </div>
    <input id="query-input" class="text-field" type="text" placeholder="輸入中文商品名稱">
    <p id="sync-status"></p>
    <button class="btn btn-primary" id="biggo-btn" onclick="openBiggo()" style="display:none;">在 BigGo 比價 →</button>
    <button class="btn btn-danger" id="forget-btn" onclick="forgetBarcode()" style="display:none;">刪除此商品記憶</button>
    <button class="btn btn-secondary" id="lens-pick-btn" onclick="openLens()">以圖搜尋 Google Lens →</button>
    <div id="lens-preview-wrap" style="display:none; width:100%; text-align:center;">
      <img id="lens-preview" style="max-width:100%; border-radius:12px; max-height:220px; object-fit:contain;">
      <p style="font-size:12px; color:#888; margin-top:8px;">拍好後點下方按鈕分享到 Google Lens</p>
      <button class="btn btn-primary" style="margin-top:8px;" onclick="shareLens()">分享圖片到 Google Lens →</button>
    </div>
    <button class="btn btn-secondary" onclick="showHome()">返回</button>
  </div>

  <input id="lens-file" type="file" accept="image/*" capture="environment" style="display:none;">

  <!-- Settings -->
  <div id="settings-section">
    <p class="settings-label">GitHub Token（gist 權限）</p>
    <input id="gh-token" class="text-field" type="password" placeholder="ghp_xxxx 或 gho_xxxx" style="display:block">
    <p class="settings-label">Gist ID</p>
    <input id="gist-id" class="text-field" type="text" placeholder="Gist ID" style="display:block">
    <button class="btn btn-primary" onclick="saveSettings()">儲存並同步</button>
    <p class="settings-note">資料存在你的瀏覽器，不會出現在程式碼裡。</p>
    <div style="width:100%;height:1px;background:#222;margin:4px 0;"></div>
    <button class="btn btn-secondary" id="manual-sync-btn" onclick="manualSync()">立即同步到雲端</button>
    <p id="manual-sync-status" style="font-size:12px;color:#555;text-align:center;"></p>
  </div>

  <script>
    const DB_KEY = 'barcode_names';
    const GH_TOKEN_KEY = 'gh_token';
    const GIST_ID_KEY = 'gist_id';
    let currentBarcode = '';
    let scanner = null;
    let cameraUsed = false;

    function getDB() {
      try { return JSON.parse(localStorage.getItem(DB_KEY) || '{}'); } catch { return {}; }
    }
    function saveDB(db) { localStorage.setItem(DB_KEY, JSON.stringify(db)); }
    function getCachedName(b) { return getDB()[b] || null; }
    function cacheName(b, name) {
      if (!name.trim()) return;
      const db = getDB(); db[b] = name.trim(); saveDB(db);
    }
    function getGistCreds() {
      return {
        token: localStorage.getItem(GH_TOKEN_KEY) || '',
        gistId: localStorage.getItem(GIST_ID_KEY) || ''
      };
    }

    // Gist 同步
    async function syncFromGist() {
      const { token, gistId } = getGistCreds();
      if (!token || !gistId) return;
      try {
        const res = await fetch(`https://api.github.com/gists/${gistId}`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        const data = await res.json();
        const content = data.files?.['barcode-names.json']?.content;
        if (content) {
          const remote = JSON.parse(content);
          const merged = { ...remote, ...getDB() };
          saveDB(merged);
        }
      } catch (_) {}
    }

    async function syncToGist() {
      const { token, gistId } = getGistCreds();
      if (!token || !gistId) return false;
      try {
        const res = await fetch(`https://api.github.com/gists/${gistId}`, {
          method: 'PATCH',
          headers: {
            Authorization: `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            files: { 'barcode-names.json': { content: JSON.stringify(getDB(), null, 2) } }
          })
        });
        return res.ok;
      } catch { return false; }
    }

    function stopMediaTracks() {
      document.querySelectorAll('video').forEach(v => {
        if (v.srcObject) { v.srcObject.getTracks().forEach(t => t.stop()); v.srcObject = null; }
      });
    }

    function hideAll() {
      if (scanner) { scanner.stop().catch(() => {}); scanner = null; }
      stopMediaTracks();
      document.getElementById('reader').innerHTML = '';
      document.getElementById('home-section').classList.remove('show');
      document.getElementById('scanner-section').style.display = 'none';
      document.getElementById('result-section').classList.remove('show');
      document.getElementById('settings-section').classList.remove('show');
    }

    function setHomeBtn(visible) {
      document.getElementById('home-btn').style.display = visible ? 'block' : 'none';
    }

    function showHome() {
      hideAll();
      setHomeBtn(false);
      document.getElementById('settings-btn').textContent = '設定';
      document.getElementById('history-search').value = '';
      renderHistory();
      document.getElementById('home-section').classList.add('show');
    }

    function startScanner() {
      if (cameraUsed) { window.location.reload(); return; }
      cameraUsed = true;
      hideAll();
      setHomeBtn(true);
      document.getElementById('scanner-section').style.display = 'block';
      document.getElementById('hint').textContent = '將相機對準條碼，保持穩定';
      setTimeout(() => {
        scanner = new Html5Qrcode("reader");
        scanner.start(
          { facingMode: "environment" },
          {
            fps: 15, aspectRatio: 1.7777778,
            formatsToSupport: [
              Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
              Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E,
              Html5QrcodeSupportedFormats.CODE_128,
            ],
            experimentalFeatures: { useBarCodeDetectorIfSupported: true }
          },
          onScanSuccess, () => {}
        ).catch(() => {
          document.getElementById('hint').textContent = '無法開啟相機，請確認已授權。';
        });
      }, 300);
    }

    async function onScanSuccess(barcode) {
      await scanner.stop(); scanner = null;
      stopMediaTracks();
      document.getElementById('reader').innerHTML = '';
      currentBarcode = barcode;

      document.getElementById('scanner-section').style.display = 'none';
      document.getElementById('barcode-display').textContent = '條碼：' + barcode;
      document.getElementById('product-display').textContent = '';
      document.getElementById('status-badge').style.display = 'none';
      document.getElementById('forget-btn').style.display = 'none';
      document.getElementById('biggo-btn').style.display = 'none';
      document.getElementById('query-input').style.display = 'none';
      document.getElementById('sync-status').textContent = '';
      lensFile = null;
      document.getElementById('lens-pick-btn').style.display = 'block';
      document.getElementById('lens-pick-btn').textContent = '以圖搜尋 Google Lens →';
      document.getElementById('lens-preview-wrap').style.display = 'none';
      document.getElementById('lens-preview').src = '';
      document.getElementById('result-section').classList.add('show');

      const cached = getCachedName(barcode);
      if (cached) {
        document.getElementById('product-display').textContent = cached;
        showBadge('badge-cached', '已記憶');
        document.getElementById('query-input').value = cached;
        document.getElementById('query-input').style.display = 'block';
        document.getElementById('biggo-btn').style.display = 'block';
        document.getElementById('forget-btn').style.display = 'block';
        return;
      }

      document.getElementById('product-display').innerHTML =
        '<span class="not-found">找不到商品名稱<br>請輸入中文名稱後搜尋</span>';
      document.getElementById('query-input').value = '';
      document.getElementById('query-input').style.display = 'block';
      document.getElementById('biggo-btn').style.display = 'block';
    }

    async function openBiggo() {
      const q = document.getElementById('query-input').value.trim() || currentBarcode;
      if (!q) return;

      const existing = getCachedName(currentBarcode);
      const changed = existing !== q;
      cacheName(currentBarcode, q);

      if (changed && /[一-鿿]/.test(q)) {
        document.getElementById('sync-status').textContent = '同步到雲端...';
        const ok = await syncToGist();
        document.getElementById('sync-status').textContent = ok ? '已同步' : '同步失敗（已存本機）';
      }

      window.open(`https://biggo.com.tw/s/${encodeURIComponent(q)}`, '_blank');
    }

    function showBadge(cls, text) {
      const b = document.getElementById('status-badge');
      b.className = 'badge ' + cls; b.textContent = text; b.style.display = 'inline-block';
    }

    function forgetBarcode() {
      const db = getDB(); delete db[currentBarcode]; saveDB(db);
      syncToGist();
      document.getElementById('forget-btn').style.display = 'none';
      document.getElementById('status-badge').style.display = 'none';
    }

    function toggleSettings() {
      const s = document.getElementById('settings-section');
      const showing = s.classList.contains('show');
      hideAll();
      if (!showing) {
        const { token, gistId } = getGistCreds();
        document.getElementById('gh-token').value = token;
        document.getElementById('gist-id').value = gistId;
        s.classList.add('show');
        setHomeBtn(true);
        document.getElementById('settings-btn').textContent = '關閉';
      } else {
        showHome();
      }
    }

    async function saveSettings() {
      localStorage.setItem(GH_TOKEN_KEY, document.getElementById('gh-token').value.trim());
      localStorage.setItem(GIST_ID_KEY, document.getElementById('gist-id').value.trim());
      const btn = document.querySelector('#settings-section .btn-primary');
      btn.textContent = '同步中...';
      await syncFromGist();
      btn.textContent = '儲存並同步';
      showHome();
    }

    async function manualSync() {
      const btn = document.getElementById('manual-sync-btn');
      const status = document.getElementById('manual-sync-status');
      btn.textContent = '同步中...';
      btn.disabled = true;
      const ok = await syncToGist();
      btn.textContent = '立即同步到雲端';
      btn.disabled = false;
      status.textContent = ok
        ? '✓ 已同步（' + new Date().toLocaleTimeString('zh-TW') + '）'
        : '✗ 同步失敗，請檢查網路或 Token';
      status.style.color = ok ? '#4cd964' : '#ff453a';
    }

    function renderHistory() {
      const db = getDB();
      const list = document.getElementById('history-list');
      const q = (document.getElementById('history-search')?.value || '').trim().toLowerCase();
      let entries = Object.entries(db);
      if (q) entries = entries.filter(([, name]) => name.toLowerCase().includes(q));
      if (entries.length === 0) {
        list.innerHTML = `<p class="history-empty">${q ? '找不到符合的商品' : '尚無記憶的商品'}</p>`;
        return;
      }
      list.innerHTML = entries.map(([barcode, name]) => `
        <div class="history-item">
          <div class="history-item-info" onclick="searchFromHistory('${name.replace(/'/g, "\\'")}')">
            <div class="history-item-name" id="hname-${barcode}">${name}</div>
            <div class="history-item-barcode">${barcode}</div>
          </div>
          <div class="history-item-actions">
            <button class="icon-btn" onclick="event.stopPropagation();editHistory('${barcode}')">✏️</button>
            <button class="icon-btn" onclick="deleteHistory('${barcode}')">🗑</button>
          </div>
        </div>
      `).join('');
    }

    function searchFromHistory(name) {
      if (document.querySelector('#history-list input')) return;
      window.open(`https://biggo.com.tw/s/${encodeURIComponent(name)}`, '_blank');
    }

    function editHistory(barcode) {
      const nameDiv = document.getElementById('hname-' + barcode);
      if (!nameDiv) return;
      const currentName = getDB()[barcode] || '';
      nameDiv.innerHTML = `<input
        id="hedit-${barcode}"
        style="width:100%;background:transparent;border:none;border-bottom:1px solid #555;color:#fff;font-size:15px;font-weight:600;padding:2px 0;outline:none;"
        value="${currentName.replace(/"/g, '&quot;')}"
        onclick="event.stopPropagation()"
        onblur="saveHistoryEdit('${barcode}')"
        onkeydown="if(event.key==='Enter'){this.blur();event.preventDefault();}">`;
      setTimeout(() => {
        const input = document.getElementById('hedit-' + barcode);
        if (input) { input.focus(); input.select(); }
      }, 50);
    }

    async function saveHistoryEdit(barcode) {
      const input = document.getElementById('hedit-' + barcode);
      if (!input) return;
      const newName = input.value.trim();
      const oldName = getDB()[barcode];
      if (newName && newName !== oldName) {
        cacheName(barcode, newName);
        syncToGist();
      }
      renderHistory();
    }

    function deleteHistory(barcode) {
      const db = getDB(); delete db[barcode]; saveDB(db);
      syncToGist();
      renderHistory();
    }

    fetch('https://api.github.com/repos/rogerccy/scan-price/commits/master')
      .then(r => r.json())
      .then(d => {
        const t = new Date(d.commit.author.date);
        document.getElementById('build-ver').textContent =
          'deployed: ' + t.toLocaleString('zh-TW', {timeZone:'Asia/Taipei'});
      }).catch(() => {});

    let lensFile = null;

    function openLens() {
      const fileInput = document.getElementById('lens-file');
      fileInput.onchange = () => {
        if (!fileInput.files.length) return;
        lensFile = fileInput.files[0];
        const reader = new FileReader();
        reader.onload = (e) => {
          document.getElementById('lens-preview').src = e.target.result;
          document.getElementById('lens-preview-wrap').style.display = 'block';
          document.getElementById('lens-pick-btn').textContent = '重新拍照';
        };
        reader.readAsDataURL(lensFile);
        fileInput.value = '';
      };
      fileInput.click();
    }

    async function shareLens() {
      if (!lensFile) return;
      if (!navigator.share || !navigator.canShare({ files: [lensFile] })) {
        alert('此裝置不支援分享，請長按圖片使用 Google Lens');
        return;
      }
      try {
        await navigator.share({ files: [lensFile], title: '商品圖片' });
      } catch (e) {}
    }

    syncFromGist().then(() => showHome());
  </script>
</body>
</html>
